# Plataforma de gestión de solicitudes operacionales — stack local completo.
# Arranque: docker compose up --build   (requisito §6.2 del reto)
#
# Fase 0 (actual): infraestructura + los dos microservicios que arrancan sanos.
#   - SQL Server (persistencia operacional + analítica)
#   - mssql-init (crea las bases 'solicitudes' e 'indicadores')
#   - Kafka (broker de eventos, se cablea a la app en Fase 2)
#   - Keycloak (IdP, se cablea en Fase 3)
#   - svc-solicitudes, svc-indicadores
# El frontend (shell + microfrontend) se añade en fases posteriores.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ps-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks: [ps-net]

  # Contenedor de un solo uso: espera a SQL Server y crea las dos bases de datos.
  # Los servicios esperan a que ESTE termine con éxito (service_completed_successfully).
  mssql-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: ps-mssql-init
    depends_on:
      - sqlserver
    environment:
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./scripts/init-mssql.sh:/init-mssql.sh:ro
    entrypoint: ["bash", "/init-mssql.sh"]
    networks: [ps-net]

  kafka:
    image: bitnami/kafka:3.7
    container_name: ps-kafka
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    networks: [ps-net]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ps-keycloak
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8081:8080"
    networks: [ps-net]

  svc-solicitudes:
    build:
      context: ./backend/svc-solicitudes
    container_name: ps-svc-solicitudes
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=solicitudes;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [ps-net]

  svc-indicadores:
    build:
      context: ./backend/svc-indicadores
    container_name: ps-svc-indicadores
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=indicadores;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [ps-net]

volumes:
  mssql-data:

networks:
  ps-net:
    driver: bridge
