# Plataforma de gestión de solicitudes operacionales — stack local completo.
# Arranque: docker compose up --build   (requisito §6.2 del reto)
#
# Fase 0 (actual): infraestructura + los dos microservicios que arrancan sanos.
#   - SQL Server (persistencia operacional + analítica)
#   - mssql-init (crea las bases 'solicitudes' e 'indicadores')
#   - Kafka (broker de eventos, se cablea a la app en Fase 2)
#   - Keycloak (IdP, se cablea en Fase 3)
#   - svc-solicitudes, svc-indicadores
# El frontend (shell + microfrontend) se añade en fases posteriores.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ps-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks: [ps-net]

  # Contenedor de un solo uso: espera a SQL Server y crea las dos bases de datos.
  # Los servicios esperan a que ESTE termine con éxito (service_completed_successfully).
  mssql-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: ps-mssql-init
    depends_on:
      - sqlserver
    environment:
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./scripts/init-mssql.sh:/init-mssql.sh:ro
    entrypoint: ["bash", "/init-mssql.sh"]
    networks: [ps-net]

  kafka:
    image: apache/kafka:3.9.0
    container_name: ps-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    networks: [ps-net]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ps-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8081:8080"
    networks: [ps-net]

  svc-solicitudes:
    build:
      context: ./backend/svc-solicitudes
    container_name: ps-svc-solicitudes
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=solicitudes;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/solicitudes/protocol/openid-connect/certs"
      KEYCLOAK_ISSUER: "http://localhost:8081/realms/solicitudes"
    ports:
      # Puerto de host configurable (default 8080). Override local vía SVC_SOLICITUDES_PORT.
      - "${SVC_SOLICITUDES_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [ps-net]

  svc-indicadores:
    build:
      context: ./backend/svc-indicadores
    container_name: ps-svc-indicadores
    depends_on:
      mssql-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=indicadores;encrypt=true;trustServerCertificate=true"
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ${MSSQL_SA_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/solicitudes/protocol/openid-connect/certs"
      KEYCLOAK_ISSUER: "http://localhost:8081/realms/solicitudes"
    ports:
      - "${SVC_INDICADORES_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [ps-net]

  # Microfrontend remoto (federado) — sirve remoteEntry.js con CORS.
  mf-remoto:
    build:
      context: ./frontend/mf-remoto
    container_name: ps-mf-remoto
    ports:
      - "3002:8080"
    networks: [ps-net]

  # Shell (host) — carga el remoto por Module Federation en runtime.
  shell:
    build:
      context: ./frontend/shell
    container_name: ps-shell
    depends_on:
      - svc-solicitudes
      - svc-indicadores
      - mf-remoto
      - keycloak
    ports:
      - "5173:8080"
    networks: [ps-net]

volumes:
  mssql-data:

networks:
  ps-net:
    driver: bridge
