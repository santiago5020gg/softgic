server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # remoteEntry.js y los chunks deben ser cargables desde el origen del shell
    # (otro puerto), por eso se habilita CORS en los estáticos JS/JSON.
    location ~* \.(js|mjs|json)$ {
        add_header Access-Control-Allow-Origin  *  always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        try_files $uri =404;
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        try_files $uri $uri/ /index.html;
    }
}
