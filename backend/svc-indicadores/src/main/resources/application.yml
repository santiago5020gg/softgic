server:
  port: 8080

spring:
  application:
    name: svc-indicadores
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=indicadores;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:Str0ng!Passw0rd2026}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    # Consumidor idempotente de eventos (Fase 2).
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: svc-indicadores
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Seguridad (Fase 3): valida JWT de Keycloak para proteger los endpoints de indicadores.
keycloak:
  jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/solicitudes/protocol/openid-connect/certs}
  issuer: ${KEYCLOAK_ISSUER:http://localhost:8081/realms/solicitudes}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
