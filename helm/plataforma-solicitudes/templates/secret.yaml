{{/* Solo se crea si NO se referencia un Secret externo (existingSecret vacío).
     El valor por defecto es un placeholder de EJEMPLO; en producción usar existingSecret. */}}
{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app.kubernetes.io/part-of: plataforma-solicitudes
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.databasePassword | quote }}
{{- end }}
